<div class="team-card">

    <div class="image">
        <img src="{{ item.url }}" alt="{{ item.name }}"/>
    </div>

    <span style="font-size: 20px; font-weight: 600;" >
        {{ item.name }}
    </span>

    <span style="font-size: 20px; font-weight: 400;" >
        {{ item.role }}
    </span>

</div>
