<div class="news-detail">

    <div class="return" (click)="close()">
        <span style="font-size: 20px; font-weight: 700;">
            🠘 Назад
        </span>
    </div>

    <div class="body">

        <div class="title">
            <span style="font-size: 45px; font-weight: 800; margin-left: 20px;">
                {{ detail?.title }}
            </span>
        </div>

        <span style="font-size: 20px; font-weight: 500; line-height: 1; color: black; margin-bottom: 7vh; " [innerHTML]="detail.text">
        </span>
    </div>

</div>
