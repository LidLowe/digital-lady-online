<div class="news-card">

    <div class="image">
        <img src="{{item.url}}">
    </div>

    <div class="textbox">
        <span style="font-size: 15px; font-weight: 500; color: gray;">
            {{ item.title }}
        </span>

        <span style="font-size: 25px; font-weight: 900;">
            {{ item.description }}
        </span>
  </div>

</div>
