<div class="news-card">

    <div class="image">
        <img src="{{item.url}}">
    </div>

    <div class="textbox">
        <span style="font-size: 15px; color: #000000; font-weight: 550;">
            {{ item.title }}
        </span>

        <span style="font-size: 23px; color: #000000; font-weight: 700;">
            {{ item.description }}
        </span>
  </div>

</div>
