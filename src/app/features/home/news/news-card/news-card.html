<div class="news-card" (click)="openDialog()">

    <div class="image">
        <img src="{{item.url}}">
    </div>

    <div class="textbox">
        <span style="font-size: 15px; font-weight: 500; color: gray; margin-bottom: 5px;">
            {{ item.title }}
        </span>

        <span style="font-size: 20px; font-weight: 850;">
            {{ item.description }}
        </span>
  </div>

</div>
